services:
  - type: web
    name: hospital-elyon-backend
    env: node
    plan: free
    buildCommand: cd hospital-backend && npm install
    startCommand: cd hospital-backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 24h
      - key: CORS_ORIGIN
        value: https://hospital-lac-mu.vercel.app,http://localhost:3000
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@hospital.local
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
